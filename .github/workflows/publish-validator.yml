# Tag scheme: independent versions, one tag per package.
#
#   validator-v<version>           publishes packages/validator          (@mizchi/jsimd-validator)
#   validator-compiler-v<version>  publishes packages/validator-compiler (@mizchi/jsimd-validator-compiler)
#
# Pushing one of these tags is the only way to publish. The tag must equal the version in that
# package's package.json and deno.json, or the job stops before anything is built.
#
# npm trusts this workflow by filename (Trusted Publishing over OIDC, provenance attached), so
# renaming the file requires registering the trusted publisher again:
#   npm trust github <package> --repo mizchi/jsimd --file publish-validator.yml --allow-publish -y
# Do not add an npm token to this workflow: a token takes precedence over OIDC.
#
# The release steps are documented in docs/validator-release.md.
name: publish-validator

on:
  push:
    tags:
      - "validator-v*"
      - "validator-compiler-v*"

permissions: {}

concurrency:
  group: publish-validator-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Tag matches the package version
        id: package
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            validator-v*)
              component="validator"
              ;;
            validator-compiler-v*)
              component="validator-compiler"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          directory="packages/$component"
          version="${GITHUB_REF_NAME#"$component-v"}"
          for manifest in package.json deno.json; do
            manifest_version="$(node -p "require('./$directory/$manifest').version")"
            if [ "$manifest_version" != "$version" ]; then
              echo "$directory/$manifest is $manifest_version, tag $GITHUB_REF_NAME expects $version" >&2
              exit 1
            fi
          done
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.4

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Set up ripgrep
        run: sudo apt-get install --no-install-recommends --yes ripgrep

      - name: Set up wasm-tools
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          echo "b171e20fd107e63e89ef6c936b5581597666a086af677d7818de92b7cdd5a86d  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release artifacts
        run: just release-check-validator-packages

      - name: Require npm 11 for OIDC provenance
        run: npm install --global npm@11

      # pnpm pack builds the package (prepack) and writes the tarball; the npm CLI publishes it
      # through OIDC. A pre-release version (one containing "-") goes to the "next" dist-tag.
      - name: Publish with npm Trusted Publishing
        shell: bash
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          pack="$RUNNER_TEMP/pack"
          mkdir -p "$pack"
          (cd "$PACKAGE_DIRECTORY" && pnpm pack --pack-destination "$pack")
          set -- "$pack"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one tarball in $pack" >&2
            exit 1
          fi
          case "$PACKAGE_VERSION" in
            *-*) npm publish "$1" --access public --tag next ;;
            *)   npm publish "$1" --access public ;;
          esac

      - name: GitHub release from the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          prerelease=""
          case "$PACKAGE_VERSION" in *-*) prerelease="--prerelease" ;; esac
          awk -v h="## $PACKAGE_VERSION" '$0 == h || index($0, h" ") == 1 { on = 1; next } on && /^## / { exit } on' "$PACKAGE_DIRECTORY/CHANGELOG.md" > "$notes" 2>/dev/null || true
          if [ -s "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes" $prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
