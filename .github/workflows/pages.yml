name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "experiments/pixel-gear/**"
      - "experiments/ui-core-simd/pixel_options.ts"
      - "experiments/ui-core-simd/pixel_sim.ts"
      - "experiments/ui-core-simd/signal_graph.ts"
      - "experiments/ui-core-simd/signal_kernel.ts"
      - "experiments/ui-core-simd/signals.ts"
      - "experiments/ui-core-simd/signals.wasm"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.4

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Set up Zig 0.16.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Set up wasm-tools 1.245.1
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          echo "b171e20fd107e63e89ef6c936b5581597666a086af677d7818de92b7cdd5a86d  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Set up Binaryen 116
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz
          echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test isolated experiment
        run: just test-pixel-gear-experiment

      - name: Verify generated Wasm is committed
        run: git diff --exit-code -- experiments/pixel-gear/zig/kernel.wasm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Pages artifact
        run: >-
          pnpm --config.verify-deps-before-run=false exec vite build
          experiments/pixel-gear/browser
          --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: experiments/pixel-gear/browser/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
