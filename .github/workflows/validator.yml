name: validator

on:
  pull_request:
    paths:
      - ".github/workflows/validator.yml"
      - ".github/workflows/release-please.yml"
      - ".github/workflows/publish-validator.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "docs/validator-release.md"
      - "packages/validator/**"
      - "packages/validator-compiler/**"
      - "examples/validator-compiler-zod/**"
      - "examples/validator-compiler-zod-wasm/**"
      - "deno.json"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tools/build-typescript-package.ts"
      - "tools/measure-validator-bundles.ts"
      - "tools/measure-validator-compiler.ts"
      - "tools/measure-validator-schema-sizes.ts"
      - "tools/measure-validator-wasm-comparison.ts"
      - "tools/smoke-validator-package.ts"
      - "tools/smoke-validator-compiler-package.ts"
      - "tools/validator_release_contract_test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validator.yml"
      - ".github/workflows/release-please.yml"
      - ".github/workflows/publish-validator.yml"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "docs/validator-release.md"
      - "packages/validator/**"
      - "packages/validator-compiler/**"
      - "examples/validator-compiler-zod/**"
      - "examples/validator-compiler-zod-wasm/**"
      - "deno.json"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tools/build-typescript-package.ts"
      - "tools/measure-validator-bundles.ts"
      - "tools/measure-validator-compiler.ts"
      - "tools/measure-validator-schema-sizes.ts"
      - "tools/measure-validator-wasm-comparison.ts"
      - "tools/smoke-validator-package.ts"
      - "tools/smoke-validator-compiler-package.ts"
      - "tools/validator_release_contract_test.ts"
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Run non-gating comparative microbenchmarks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify validator package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.4

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Set up wasm-tools
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          echo "b171e20fd107e63e89ef6c936b5581597666a086af677d7818de92b7cdd5a86d  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/wasm-tools"
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP/wasm-tools" --strip-components=1
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated SIMD kernel
        run: |
          just build-validator-simd
          git diff --exit-code -- packages/validator/src/simd/kernels.wasm

      - name: Test contracts and SIMD boundaries
        run: |
          just test-validator
          just test-validator-compiler
          just test-validator-release

      - name: Verify package contents
        run: |
          just build-validator-package
          just build-validator-compiler-package
          deno run -A tools/smoke-validator-package.ts
          deno run -A tools/smoke-validator-compiler-package.ts

      - name: Compile and run Zod subset example
        run: just check-validator-compiler-zod-example

      - name: Compile and run Zod Wasm SIMD example
        run: just check-validator-compiler-zod-wasm-example

      - name: Verify tree-shaking budgets
        run: just check-validator-tree-shake

      - name: Measure comparison bundles
        run: |
          just measure-validator-bundles
          just measure-validator-compiler
          just measure-validator-schema-sizes
          just measure-validator-wasm-comparison

      - name: Run comparative benchmarks
        if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
        run: |
          just bench-validator
          just bench-validator-compiler
